<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contagem Regressiva</title>
  <link rel="stylesheet" href="estilo.css">
  <link rel="shortcut icon" href="./img/logo.ico">
</head>
<body>
    <section class="countdown-container">
      <div class="logo">
        <a href="https://mkt.sescms.com.br/semana-s" target="_blank">
          <img src="img/logo.png" alt="Logo do Evento">
        </a>
      </div>
        <h1>Faltam:</h1>
        <div class="timer">
          <div class="tempo-box">
            <img src="img/calendario.png" alt="Dias">
            <span id="dias">00</span>
            <small>Dias</small>
          </div>
          <div class="tempo-box">
            <img src="img/calendario.png" alt="Horas">
            <span id="horas">00</span>
            <small>Horas</small>
          </div>
          <div class="tempo-box">
            <img src="img/calendario.png" alt="Minutos">
            <span id="minutos">00</span>
            <small>Minutos</small>
          </div>
          <div class="tempo-box">
            <img src="img/calendario.png" alt="Segundos">
            <span id="segundos">00</span>
            <small>Segundos</small>
          </div>
        </div>
        
      </section>
      <div class="footer"><img src="img/footer.png" alt=""></div>
      
  <script src="script.js"></script>
</body>
</html>
